<svg width="450" height="200" xmlns="http://www.w3.org/2000/svg">
    <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#00D4FF"/>
        <stop offset="100%" stop-color="#6C3BFF"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
</defs>
    <rect width="100%" height="100%" fill="#090A0F" rx="10" stroke="url(#neon)" stroke-width="2"/>
    <rect width="100%" height="100%" fill="url(#dots)" rx="10"/>
    <text x="20" y="30" fill="#00D4FF" font-family="sans-serif" font-size="18" font-weight="bold">Achievements</text><polygon points="55,80 80,65 105,80 105,110 80,125 55,110" fill="#0d1117" stroke="url(#neon)" stroke-width="2"/>
        <text x="80" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">0</text>
        <text x="80" y="140" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">COMMITS</text><polygon points="120,80 145,65 170,80 170,110 145,125 120,110" fill="#0d1117" stroke="url(#neon)" stroke-width="2"/>
        <text x="145" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">28</text>
        <text x="145" y="140" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">STARS</text><polygon points="185,80 210,65 235,80 235,110 210,125 185,110" fill="#0d1117" stroke="url(#neon)" stroke-width="2"/>
        <text x="210" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">4</text>
        <text x="210" y="140" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">REPOS</text><polygon points="250,80 275,65 300,80 300,110 275,125 250,110" fill="#0d1117" stroke="url(#neon)" stroke-width="2"/>
        <text x="275" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">3</text>
        <text x="275" y="140" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">FOLLOWERS</text><polygon points="315,80 340,65 365,80 365,110 340,125 315,110" fill="#0d1117" stroke="url(#neon)" stroke-width="2"/>
        <text x="340" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">11</text>
        <text x="340" y="140" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">STREAK</text><polygon points="380,80 405,65 430,80 430,110 405,125 380,110" fill="#0d1117" stroke="url(#neon)" stroke-width="2"/>
        <text x="405" y="95" fill="#c9d1d9" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">26</text>
        <text x="405" y="140" fill="#8b949e" font-family="sans-serif" font-size="10" text-anchor="middle">MERGED</text>
    </svg>