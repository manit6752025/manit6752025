<svg xmlns="http://www.w3.org/2000/svg" width="495" height="160" viewBox="0 0 495 160"><style>
text{font-family:'JetBrains Mono','Fira Code','Segoe UI',monospace}
.t{fill:#00D4FF;font-size:15px;font-weight:700}
.l{fill:#9AA0B4;font-size:11.5px}
.v{fill:#FFFFFF;font-size:14px;font-weight:700}
.big{fill:#FFFFFF;font-size:30px;font-weight:800}
.row{opacity:0;animation:in .7s ease-out forwards}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.cur{animation:blink 1s steps(1) infinite}
.ring{stroke-dashoffset:var(--c);animation:ring 1.8s ease-out .4s forwards}
.lap{stroke-dasharray:30 70;animation:lap 5s linear infinite}
.scan{animation:scan 4s linear infinite}
.sw{animation:sweep 5s linear infinite}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flame 1.2s ease-in-out infinite}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.5s ease-out .5s forwards}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{to{stroke-dashoffset:var(--o)}}
@keyframes lap{to{stroke-dashoffset:-100}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(320px)}}
@keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(900px)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
@keyframes flame{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.92)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090A0F"/><stop offset=".6" stop-color="#14213D"/><stop offset="1" stop-color="#241466"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#6C3BFF"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><clipPath id="c"><rect width="495" height="160" rx="14"/></clipPath><rect x=".5" y=".5" width="494" height="159" rx="14" fill="url(#bg)"/><g clip-path="url(#c)"><circle cx="17" cy="156" r="1.2" fill="#00D4FF" style="animation:float 3s linear 0.00s infinite"/><circle cx="70" cy="156" r="1.8" fill="#6C3BFF" style="animation:float 4s linear 0.45s infinite"/><circle cx="123" cy="156" r="2.4" fill="#00D4FF" style="animation:float 5s linear 0.90s infinite"/><circle cx="176" cy="156" r="1.2" fill="#6C3BFF" style="animation:float 6s linear 1.35s infinite"/><circle cx="229" cy="156" r="1.8" fill="#00D4FF" style="animation:float 3s linear 1.80s infinite"/><circle cx="282" cy="156" r="2.4" fill="#6C3BFF" style="animation:float 4s linear 2.25s infinite"/><circle cx="335" cy="156" r="1.2" fill="#00D4FF" style="animation:float 5s linear 2.70s infinite"/><circle cx="388" cy="156" r="1.8" fill="#6C3BFF" style="animation:float 6s linear 3.15s infinite"/><circle cx="441" cy="156" r="2.4" fill="#00D4FF" style="animation:float 3s linear 3.60s infinite"/><circle cx="494" cy="156" r="1.2" fill="#6C3BFF" style="animation:float 4s linear 4.05s infinite"/><circle cx="52" cy="156" r="1.8" fill="#00D4FF" style="animation:float 5s linear 4.50s infinite"/><circle cx="105" cy="156" r="2.4" fill="#6C3BFF" style="animation:float 6s linear 4.95s infinite"/><circle cx="158" cy="156" r="1.2" fill="#00D4FF" style="animation:float 3s linear 5.40s infinite"/><circle cx="211" cy="156" r="1.8" fill="#6C3BFF" style="animation:float 4s linear 5.85s infinite"/><rect class="scan" x="0" y="0" width="495" height="2" fill="#00D4FF" opacity=".18"/><rect class="sw" x="0" y="0" width="140" height="160" fill="url(#sw)"/><text x="24" y="34" class="t">Achievements</text><rect class="cur" x="138" y="21" width="8" height="15" fill="#00D4FF"/><g class="pop" style="animation-delay:0.00s"><polygon points="74.5,71.0 74.5,97.0 52.0,110.0 29.5,97.0 29.5,71.0 52.0,58.0" fill="#00D4FF" fill-opacity=".12" stroke="#00D4FF" stroke-opacity=".5" stroke-width="1.5"/><text x="52" y="86" text-anchor="middle" class="v">4,233</text><text x="52" y="126" text-anchor="middle" class="l" style="font-size:8px">COMMITS</text></g><g class="pop" style="animation-delay:0.10s"><polygon points="152.5,71.0 152.5,97.0 130.0,110.0 107.5,97.0 107.5,71.0 130.0,58.0" fill="#6C3BFF" fill-opacity=".12" stroke="#6C3BFF" stroke-opacity=".5" stroke-width="1.5"/><text x="130" y="86" text-anchor="middle" class="v">39</text><text x="130" y="126" text-anchor="middle" class="l" style="font-size:8px">STARS</text></g><g class="pop" style="animation-delay:0.20s"><polygon points="230.5,71.0 230.5,97.0 208.0,110.0 185.5,97.0 185.5,71.0 208.0,58.0" fill="#3FA9FF" fill-opacity=".12" stroke="#3FA9FF" stroke-opacity=".5" stroke-width="1.5"/><text x="208" y="86" text-anchor="middle" class="v">5</text><text x="208" y="126" text-anchor="middle" class="l" style="font-size:8px">REPOS</text></g><g class="pop" style="animation-delay:0.30s"><polygon points="308.5,71.0 308.5,97.0 286.0,110.0 263.5,97.0 263.5,71.0 286.0,58.0" fill="#9B6BFF" fill-opacity=".12" stroke="#9B6BFF" stroke-opacity=".5" stroke-width="1.5"/><text x="286" y="86" text-anchor="middle" class="v">4</text><text x="286" y="126" text-anchor="middle" class="l" style="font-size:8px">FOLLOWERS</text></g><g class="pop" style="animation-delay:0.40s"><polygon points="386.5,71.0 386.5,97.0 364.0,110.0 341.5,97.0 341.5,71.0 364.0,58.0" fill="#00A6A6" fill-opacity=".12" stroke="#00A6A6" stroke-opacity=".5" stroke-width="1.5"/><text x="364" y="86" text-anchor="middle" class="v">9</text><text x="364" y="126" text-anchor="middle" class="l" style="font-size:8px">STREAK</text></g><g class="pop" style="animation-delay:0.50s"><polygon points="464.5,71.0 464.5,97.0 442.0,110.0 419.5,97.0 419.5,71.0 442.0,58.0" fill="#B38CFF" fill-opacity=".12" stroke="#B38CFF" stroke-opacity=".5" stroke-width="1.5"/><text x="442" y="86" text-anchor="middle" class="v">84</text><text x="442" y="126" text-anchor="middle" class="l" style="font-size:8px">MERGED</text></g></g><rect x=".5" y=".5" width="494" height="159" rx="14" fill="none" stroke="#6C3BFF" stroke-opacity=".4"/><rect class="lap" pathLength="100" x=".5" y=".5" width="494" height="159" rx="14" fill="none" stroke="url(#ac)" stroke-width="2" filter="url(#gl)"/></svg>