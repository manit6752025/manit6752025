<svg xmlns="http://www.w3.org/2000/svg" width="495" height="196" viewBox="0 0 495 196"><style>
text{font-family:'JetBrains Mono','Fira Code','Segoe UI',monospace}
.t{fill:#00D4FF;font-size:15px;font-weight:700}
.l{fill:#9AA0B4;font-size:11.5px}
.v{fill:#FFFFFF;font-size:14px;font-weight:700}
.big{fill:#FFFFFF;font-size:30px;font-weight:800}
.row{opacity:0;animation:in .7s ease-out forwards}
.pulse{animation:pulse 2.2s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.3s cubic-bezier(.2,.8,.2,1) forwards}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.cur{animation:blink 1s steps(1) infinite}
.ring{stroke-dashoffset:var(--c);animation:ring 1.8s ease-out .4s forwards}
.lap{stroke-dasharray:30 70;animation:lap 5s linear infinite}
.scan{animation:scan 4s linear infinite}
.sw{animation:sweep 5s linear infinite}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flame 1.2s ease-in-out infinite}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.5s ease-out .5s forwards}
@keyframes in{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes ring{to{stroke-dashoffset:var(--o)}}
@keyframes lap{to{stroke-dashoffset:-100}}
@keyframes scan{from{transform:translateY(-4px)}to{transform:translateY(320px)}}
@keyframes sweep{from{transform:translateX(-140px)}to{transform:translateX(900px)}}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
@keyframes flame{0%,100%{transform:scale(1,1)}50%{transform:scale(1.12,.92)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090A0F"/><stop offset=".6" stop-color="#14213D"/><stop offset="1" stop-color="#241466"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00D4FF"/><stop offset="1" stop-color="#6C3BFF"/></linearGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><clipPath id="c"><rect width="495" height="196" rx="14"/></clipPath><rect x=".5" y=".5" width="494" height="195" rx="14" fill="url(#bg)"/><g clip-path="url(#c)"><circle cx="17" cy="192" r="1.2" fill="#00D4FF" style="animation:float 3s linear 0.00s infinite"/><circle cx="70" cy="192" r="1.8" fill="#6C3BFF" style="animation:float 4s linear 0.45s infinite"/><circle cx="123" cy="192" r="2.4" fill="#00D4FF" style="animation:float 5s linear 0.90s infinite"/><circle cx="176" cy="192" r="1.2" fill="#6C3BFF" style="animation:float 6s linear 1.35s infinite"/><circle cx="229" cy="192" r="1.8" fill="#00D4FF" style="animation:float 3s linear 1.80s infinite"/><circle cx="282" cy="192" r="2.4" fill="#6C3BFF" style="animation:float 4s linear 2.25s infinite"/><circle cx="335" cy="192" r="1.2" fill="#00D4FF" style="animation:float 5s linear 2.70s infinite"/><circle cx="388" cy="192" r="1.8" fill="#6C3BFF" style="animation:float 6s linear 3.15s infinite"/><circle cx="441" cy="192" r="2.4" fill="#00D4FF" style="animation:float 3s linear 3.60s infinite"/><circle cx="494" cy="192" r="1.2" fill="#6C3BFF" style="animation:float 4s linear 4.05s infinite"/><circle cx="52" cy="192" r="1.8" fill="#00D4FF" style="animation:float 5s linear 4.50s infinite"/><circle cx="105" cy="192" r="2.4" fill="#6C3BFF" style="animation:float 6s linear 4.95s infinite"/><circle cx="158" cy="192" r="1.2" fill="#00D4FF" style="animation:float 3s linear 5.40s infinite"/><circle cx="211" cy="192" r="1.8" fill="#6C3BFF" style="animation:float 4s linear 5.85s infinite"/><rect class="scan" x="0" y="0" width="495" height="2" fill="#00D4FF" opacity=".18"/><rect class="sw" x="0" y="0" width="140" height="196" fill="url(#sw)"/><text x="24" y="34" class="t">Contribution Streak</text><rect class="cur" x="203" y="21" width="8" height="15" fill="#00D4FF"/><line x1="165" y1="52" x2="165" y2="150" stroke="#6C3BFF" stroke-opacity=".3"/><line x1="330" y1="52" x2="330" y2="150" stroke="#6C3BFF" stroke-opacity=".3"/><g class="row"><text x="82" y="104" class="big" text-anchor="middle">2,007</text><text x="82" y="146" class="l" text-anchor="middle">CONTRIBUTIONS</text></g><g class="row" style="animation-delay:.3s"><text x="412" y="104" class="big" text-anchor="middle">9</text><text x="412" y="146" class="l" text-anchor="middle">LONGEST STREAK</text></g><circle cx="247" cy="94" r="36" fill="none" stroke="#14213D" stroke-width="7"/><circle class="ring" cx="247" cy="94" r="36" fill="none" stroke="url(#ac)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 247 94)" filter="url(#gl)" style="--c:226.2;--o:175.9;stroke-dasharray:226.2"/><g transform="translate(247,72) scale(.6)"><path class="flame" d="M0 -12 C6 -4 8 0 4 8 C2 12 -2 12 -4 8 C-7 3 -2 -2 0 -12Z" fill="#00D4FF" filter="url(#gl)"/></g><text x="247" y="108" class="big" text-anchor="middle" style="font-size:24px">2</text><text x="247" y="146" class="l" text-anchor="middle">CURRENT STREAK</text><polyline class="draw" pathLength="1" points="24.0,181.1 39.4,169.9 54.8,173.3 70.2,158.0 85.7,179.7 101.1,179.9 116.5,183.9 131.9,183.9 147.3,184.0 162.7,184.0 178.1,184.0 193.6,183.8 209.0,184.0 224.4,184.0 239.8,184.0 255.2,184.0 270.6,184.0 286.0,183.6 301.4,184.0 316.9,184.0 332.3,184.0 347.7,184.0 363.1,184.0 378.5,179.3 393.9,177.2 409.3,176.5 424.8,183.8 440.2,184.0 455.6,176.9 471.0,182.8" fill="none" stroke="url(#ac)" stroke-width="2" stroke-linejoin="round" filter="url(#gl)"/></g><rect x=".5" y=".5" width="494" height="195" rx="14" fill="none" stroke="#6C3BFF" stroke-opacity=".4"/><rect class="lap" pathLength="100" x=".5" y=".5" width="494" height="195" rx="14" fill="none" stroke="url(#ac)" stroke-width="2" filter="url(#gl)"/></svg>