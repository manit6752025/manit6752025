name: Generate Snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manit6752025
          outputs: |
            dist/snake.svg?color_snake=00D4FF&color_dots=14213D,2a1f6b,4a2fb8,6C3BFF,00D4FF
            dist/snake-dark.svg?palette=github-dark&color_snake=00D4FF&color_dots=14213D,2a1f6b,4a2fb8,6C3BFF,00D4FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
