name: Refresh stats

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate stats cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py
      - name: Commit and push
        continue-on-error: true
        run: |
          git config user.name "Manit Arora"
          git config user.email "manit6752025@gmail.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -m "refresh stats"
          git pull origin main
          git push
