name: Refresh stats

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      STATS_EXTRA_ORGS: NetCore-Technologies
    steps:
      - uses: actions/checkout@v4

      - name: Clean stats directory contents
        run: rm -rf stats/*

      - name: Generate user cards
        continue-on-error: true
        run: python3 scripts/generate_stats.py

      - name: Generate NetCore org cards
        continue-on-error: true
        env:
          STATS_OWNER: NetCore-Technologies
          STATS_KIND: org
          STATS_OUT: stats/org
        run: python3 scripts/generate_stats.py

      - name: Commit and push
        continue-on-error: true
        run: |
          git config user.name "Manit Arora"
          git config user.email "manit6752025@gmail.com"
          git add stats
          git diff --cached --quiet && exit 0
          git commit -m "refresh stats"
          git pull origin main
          git push
