name: Refresh stats

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_stats.py
      - scripts/count_branch_commits.py
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      STATS_EXTRA_ORGS: NetCore-Technologies
    steps:
      - uses: actions/checkout@v4

      - name: Delete old stat cards
        run: |
          mkdir -p stats/org
          find stats -type f -name '*.svg' -delete

      - name: Count commits across every repo and branch
        continue-on-error: true
        run: python3 scripts/count_branch_commits.py

      - name: Generate user cards
        continue-on-error: true
        run: python3 scripts/generate_stats.py

      - name: Generate NetCore org cards
        continue-on-error: true
        env:
          STATS_OWNER: NetCore-Technologies
          STATS_KIND: org
          STATS_OUT: stats/org
        run: python3 scripts/generate_stats.py

      - name: Check every card was rebuilt
        run: |
          for f in stats/stats.svg stats/langs.svg stats/streak.svg stats/achievements.svg stats/trophies.svg stats/org/stats.svg stats/org/langs.svg stats/org/streak.svg stats/org/achievements.svg stats/org/trophies.svg; do
            test -s "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Stamp README and publish
        run: |
          git config user.name "Manit Arora"
          git config user.email "manit6752025@gmail.com"
          cp -r stats /tmp/stats-new
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf stats
            cp -r /tmp/stats-new stats
            git add -A stats
            if git diff --cached --quiet -- stats; then
              echo "Cards unchanged, nothing to publish"
              exit 0
            fi
            version=$(date +%s)
            sed -E -i "s#(stats/[A-Za-z/]+\.svg)(\?v=[0-9]+)?#\1?v=${version}#g" README.md
            git add README.md
            git commit -m "refresh stats"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
